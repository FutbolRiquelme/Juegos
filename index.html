<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolRiquelme</title>

    <!-- Agregamos la fuente Poppins de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="logo">
                ⚽ FutbolRiquelme
            </div>

            <div class="menu">
                <a href="#">Conócenos</a>
                <a href="#">Ranking</a>
                <a href="#">Favoritos</a>
                <a href="#">Juegos</a>
            </div>

            <input type="text" placeholder="Buscar juego...">
        </div>
    </nav>

    <header>
        <h1>FutbolRiquelme</h1>
        <p>El único lugar donde se juega toda tu pas10n por el fútbol.</p>
    </header>

    <main>

        <!-- IMPOSTOR -->
        <div class="card">
            <h2>🕵️ Impostor Futbolero</h2>
            <p>Descubrí quién es el impostor.</p>
            <button onclick="window.location.href='juegos/impostor/index.html'">
                Jugar
            </button>
        </div>

        <!-- TATETI -->
        <div class="card">
            <h2>❌⭕ Tateti Futbolero</h2>
            <p>Completá la línea antes que tu rival.</p>
            <button onclick="window.location.href='juegos/tateti/index.html'">
                Jugar
            </button>
        </div>

        <!-- JUGADOR DEL DÍA -->
        <div class="card">
            <h2>⚽ Jugador del Día</h2>
            <p>Adiviná el jugador secreto del día.</p>
            <button onclick="window.location.href='juegos/JugadorDiario/index.html'">
                Jugar
            </button>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
